name: Terraform CI/CD

on:
  push:
    branches:
      - feature/enterprise-environments
      - main

jobs:
  terraform-plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environment/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

    #   - name: Terraform fmt
    #     run: terraform fmt

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

  terraform-apply:
    name: Apply
    # Runs only after the Plan job succeeds, and only on main.
    if: github.ref == 'refs/heads/main'
    needs: terraform-plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environment/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

    #   - name: Terraform fmt
    #     run: terraform fmt

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      # Re-create the plan because each job uses a separate runner workspace.
      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

    #   - name: Terraform apply
    #     run: terraform apply -no-color -auto-approve tfplan